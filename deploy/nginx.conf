# nginx vhost for Avenue One Agency.
#
# Install to /etc/nginx/sites-available/avenueoneagency and symlink into
# sites-enabled. This is the pre-TLS (port 80) version — `certbot --nginx`
# rewrites it in place to add the 443 server block and the http->https
# redirect, so install this first and run certbot second.

upstream avenueoneagency_app {
    server unix:/run/gunicorn/avenueoneagency.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name avenueoneagency.com www.avenueoneagency.com;

    # Admin image uploads (blog post images, team photos).
    client_max_body_size 25m;

    access_log /var/log/nginx/avenueoneagency.access.log;
    error_log  /var/log/nginx/avenueoneagency.error.log;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # Serve the .gz files whitenoise's CompressedStaticFilesStorage produces
    # at collectstatic time instead of compressing on every request.
    gzip_static on;

    # Vite emits content-hashed filenames here, so they can be cached forever.
    location /static/assets/ {
        alias /srv/avenueoneagency/staticfiles/assets/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else under /static/ keeps its original name across deploys,
    # so cache it for a shorter window.
    location /static/ {
        alias /srv/avenueoneagency/staticfiles/;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /media/ {
        alias /srv/avenueoneagency/media/;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        proxy_pass http://avenueoneagency_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
